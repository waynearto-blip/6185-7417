<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6185</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>6185</h1>
    <p>Local notes / items for the 6185 account</p>
  </header>

  <main>
    <form id="add-form">
      <input type="text" id="title" placeholder="Title" required>
      <textarea id="content" placeholder="Content (optional)"></textarea>
      <button type="submit">Add Item</button>
    </form>

    <section>
      <h2>Items</h2>
      <ul id="items-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
