<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6185 AI Builder Agent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>6185 AI Builder Agent</h1>
    <p>Contract comprehension → Presentation + Project builder</p>
  </header>

  <main>
    <section>
      <h2>Contract to Presentation</h2>
      <p>Paste a contract, SOW, or project specification for deep comprehension and a full presentation.</p>
      <form id="contract-form">
        <input type="text" id="pres-title" placeholder="Presentation title (optional)" value="Contract Review Presentation">
        <textarea id="contract-text" placeholder="Paste the full contract or specification text here..." required style="min-height: 200px;"></textarea>
        <button type="submit">Generate Comprehensive Presentation</button>
      </form>
      <div id="presentation-result"></div>
    </section>

    <hr>

    <section>
      <h2>AI Project Builder</h2>
      <form id="build-form">
        <textarea id="build-prompt" placeholder="Describe what you want the agent to build..." required></textarea>
        <button type="submit">Generate Plan</button>
      </form>
      <div id="build-result"></div>
      <h3>Recent Builds</h3>
      <ul id="builds-list"></ul>
    </section>

    <hr>

    <section>
      <h2>Local Items / Notes</h2>
      <form id="add-form">
        <input type="text" id="title" placeholder="Title" required>
        <textarea id="content" placeholder="Content (optional)"></textarea>
        <button type="submit">Add Item</button>
      </form>
      <ul id="items-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
